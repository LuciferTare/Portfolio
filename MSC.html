<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSC IT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "Salt";
        src: url("fonts/Salt.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --bg: #000000;
        --accent: #fcd535;
        --accent-dim: #fcd53518;
        --accent-border: #fcd5357e;
        --text: #d9d9d9;
        --text-muted: #d9d9d97e;
        --glass-bg: rgba(255, 255, 255, 0.06);
        --glass-border: rgba(255, 255, 255, 0.18);
        --radius: 16px;
        --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --font-heading: "Salt", serif;
        --font-body: "Work Sans", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        overflow: hidden;
        height: 100vh;
      }

      ::-webkit-scrollbar {
        width: 0;
        background-color: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: transparent;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.7;
        overflow: hidden;
        height: 100vh;
        user-select: none;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      /* ── Background glows ── */
      .bg-glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(150px);
        pointer-events: none;
        z-index: 0;
      }
      .glow-1 {
        width: 500px;
        height: 500px;
        background: radial-gradient(
          circle,
          var(--accent-border) 0%,
          transparent 75%
        );
        top: -100px;
        right: -150px;
        animation: glow-drift 9s ease-in-out infinite;
      }
      .glow-2 {
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          var(--accent-border) 0%,
          transparent 75%
        );
        bottom: 0;
        left: -100px;
        animation: glow-drift 11s ease-in-out infinite reverse;
      }
      @keyframes glow-drift {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(24px, -24px) scale(1.06);
        }
        66% {
          transform: translate(-18px, 16px) scale(0.96);
        }
      }

      /* ── Password overlay ── */
      #pw-overlay {
        position: fixed;
        inset: 0;
        background: var(--bg);
        z-index: 9999;
      }

      /* ── Layout ── */
      #protected-content {
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .container {
        width: 90%;
        max-width: 1100px;
        margin: 0 auto;
      }

      .section {
        flex: 1;
        padding: 1.5rem 0 1rem;
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
      }

      .section .container {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .section-title {
        font-family: var(--font-heading);
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        color: var(--text);
        margin-bottom: 1.2rem;
        text-align: center;
        flex-shrink: 0;
      }

      .accent {
        color: var(--accent);
      }

      /* ── Glass card ── */
      .glass-card {
        background: linear-gradient(
          145deg,
          #00000040 0%,
          #0000001a 45%,
          #00000026 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-bottom-color: rgba(255, 255, 255, 0.06);
        border-right-color: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(24px) saturate(200%) brightness(1.08);
        -webkit-backdrop-filter: blur(24px) saturate(200%) brightness(1.08);
        border-radius: var(--radius);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          inset 0 -1px 0 rgba(0, 0, 0, 0.12),
          inset 1px 0 0 rgba(255, 255, 255, 0.08);
        transition:
          border-color var(--transition),
          background var(--transition),
          transform var(--transition),
          box-shadow var(--transition);
      }
      .glass-card:hover {
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.14) 0%,
          rgba(255, 255, 255, 0.05) 45%,
          rgba(255, 255, 255, 0.1) 100%
        );
        border-color: var(--accent-border);
        border-bottom-color: rgba(252, 213, 53, 0.1);
        border-right-color: rgba(252, 213, 53, 0.1);
        box-shadow:
          0 16px 48px rgba(0, 0, 0, 0.5),
          0 0 32px var(--accent-dim),
          inset 0 1px 0 rgba(255, 255, 255, 0.24),
          inset 0 -1px 0 rgba(0, 0, 0, 0.15),
          inset 1px 0 0 rgba(255, 255, 255, 0.1);
        transform: translateY(-4px);
      }

      /* ── Animations ── */
      [data-animate] {
        opacity: 0;
        transform: translateY(28px);
        transition:
          opacity 0.65s ease,
          transform 0.65s ease;
        transition-delay: var(--delay, 0s);
      }
      [data-animate].visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* ── Cards grid ── */
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.2rem;
        flex: 1;
      }

      .card {
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        text-align: center;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        opacity: 0;
        transition: opacity var(--transition);
      }
      .card:hover::before {
        opacity: 1;
      }

      .card-name {
        font-family: var(--font-heading);
        font-size: 1.8rem;
        color: var(--text);
        transition: color var(--transition);
        letter-spacing: 1px;
        text-align: center;
        width: 100%;
      }

      .card:hover .card-name {
        color: var(--accent);
      }

      .card-bottom {
        width: 100%;
        display: flex;
        justify-content: center;
        min-height: 42px;
        align-items: flex-end;
      }

      .btn-download {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--accent);
        color: #000000;
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.65rem 1.8rem;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity var(--transition),
          transform var(--transition),
          box-shadow var(--transition);
        pointer-events: none;
        white-space: nowrap;
      }

      .card:hover .btn-download {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .btn-download:hover {
        box-shadow: 0 8px 24px var(--accent-border);
      }

      .btn-download svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div id="pw-overlay"></div>

    <div id="protected-content">
      <!-- ── Practicals ── -->
      <section class="section" id="practicals-section">
        <div class="container">
          <h2 class="section-title" data-animate="fade-up">
            <span class="accent">Practicals</span>
          </h2>
          <div class="cards-grid">
            <div
              class="card glass-card"
              data-animate="fade-up"
              style="--delay: 0.1s"
            >
              <span class="card-name">Blockchain</span>
              <div class="card-bottom">
                <button
                  class="btn-download"
                  onclick="
                    window.open(
                      'https://drive.google.com/uc?export=download&id=1Z3jWFLr6UI32tI54_utYfpB18tnbIbVG',
                      '_blank',
                    )
                  "
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                  >
                    <path d="M12 3v13M5 14l7 7 7-7" />
                    <path d="M3 21h18" />
                  </svg>
                  Download
                </button>
              </div>
            </div>

            <div
              class="card glass-card"
              data-animate="fade-up"
              style="--delay: 0.2s"
            >
              <span class="card-name">Deep Learning</span>
              <div class="card-bottom">
                <button
                  class="btn-download"
                  onclick="
                    window.open(
                      'https://drive.google.com/uc?export=download&id=1wkRt0Ndgy4S-NqX-xrUOUL0o6h3WsrIv',
                      '_blank',
                    )
                  "
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                  >
                    <path d="M12 3v13M5 14l7 7 7-7" />
                    <path d="M3 21h18" />
                  </svg>
                  Download
                </button>
              </div>
            </div>

            <div
              class="card glass-card"
              data-animate="fade-up"
              style="--delay: 0.3s"
            >
              <span class="card-name">Robotics</span>
              <div class="card-bottom">
                <button
                  class="btn-download"
                  onclick="
                    window.open(
                      'https://drive.google.com/uc?export=download&id=1mUsJ0V25Xt8n3CJJh4IbY-C6FQVZGs4M',
                      '_blank',
                    )
                  "
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                  >
                    <path d="M12 3v13M5 14l7 7 7-7" />
                    <path d="M3 21h18" />
                  </svg>
                  Download
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ── Datasets ── -->
      <section class="section" id="datasets-section">
        <div class="container">
          <h2 class="section-title" data-animate="fade-up">
            <span class="accent">Datasets</span>
          </h2>
          <div class="cards-grid">
            <div
              class="card glass-card"
              data-animate="fade-up"
              style="--delay: 0.1s"
            >
              <span class="card-name">Double_UI</span>
              <div class="card-bottom">
                <button
                  class="btn-download"
                  onclick="
                    window.open(
                      'https://drive.google.com/uc?export=download&id=1mwWIYDXMGkBpuBgltqdpWBnsJuCE9F5a',
                      '_blank',
                    )
                  "
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                  >
                    <path d="M12 3v13M5 14l7 7 7-7" />
                    <path d="M3 21h18" />
                  </svg>
                  Download
                </button>
              </div>
            </div>

            <div
              class="card glass-card"
              data-animate="fade-up"
              style="--delay: 0.2s"
            >
              <span class="card-name">EMP</span>
              <div class="card-bottom">
                <button
                  class="btn-download"
                  onclick="
                    window.open(
                      'https://drive.google.com/uc?export=download&id=1cGTyNZGLZYT8jDUJ1_lNQuQLFMHJZ_g-',
                      '_blank',
                    )
                  "
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                  >
                    <path d="M12 3v13M5 14l7 7 7-7" />
                    <path d="M3 21h18" />
                  </svg>
                  Download
                </button>
              </div>
            </div>

            <div
              class="card glass-card"
              data-animate="fade-up"
              style="--delay: 0.3s"
            >
              <span class="card-name">new_emp</span>
              <div class="card-bottom">
                <button
                  class="btn-download"
                  onclick="
                    window.open(
                      'https://drive.google.com/uc?export=download&id=1iDRRMQUrojn3uo1ithawVSDaY04XMPa_',
                      '_blank',
                    )
                  "
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                  >
                    <path d="M12 3v13M5 14l7 7 7-7" />
                    <path d="M3 21h18" />
                  </svg>
                  Download
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      // Scroll animations
      const observer = new IntersectionObserver(
        (entries) =>
          entries.forEach((e) => {
            if (e.isIntersecting) e.target.classList.add("visible");
          }),
        { threshold: 0.12 },
      );
      document
        .querySelectorAll("[data-animate]")
        .forEach((el) => observer.observe(el));

      // Password protection
      window.onload = function () {
        const correctPassword = "msc2026";
        const datasetsOnlyPassword = "msc";
        const content = document.getElementById("protected-content");
        const overlay = document.getElementById("pw-overlay");
        const practicalsSection = document.getElementById("practicals-section");
        const datasetsSection = document.getElementById("datasets-section");
        let attempts = 0,
          maxAttempts = 3;

        function showAll() {
          content.style.display = "block";
          overlay.style.display = "none";
          practicalsSection.style.display = "block";
          datasetsSection.style.display = "block";
        }

        function showDatasetsOnly() {
          content.style.display = "block";
          overlay.style.display = "none";
          practicalsSection.style.display = "none";
          datasetsSection.style.display = "block";
        }

        function askPassword() {
          const input = prompt("Enter the password to view the content:");
          if (input === null) {
            attempts++;
            if (attempts >= maxAttempts) {
              alert("Maximum attempts exceeded.");
              document.body.innerHTML =
                "<h1 style='color:white;text-align:center;margin-top:40vh;font-family:sans-serif;'>Access Denied</h1>";
            } else {
              alert("No input provided. Try again.");
              askPassword();
            }
            return;
          }
          if (input === correctPassword) {
            showAll();
          } else if (input === datasetsOnlyPassword) {
            showDatasetsOnly();
          } else {
            attempts++;
            if (attempts >= maxAttempts) {
              alert("Maximum attempts exceeded.");
              document.body.innerHTML =
                "<h1 style='color:white;text-align:center;margin-top:40vh;font-family:sans-serif;'>Access Denied</h1>";
            } else {
              alert("Incorrect password. Try again.");
              askPassword();
            }
          }
        }

        content.style.display = "none";
        askPassword();
      };
    </script>
  </body>
</html>
