<!doctype html>
<html>
  <head>
    <title>MSC IT</title>
  </head>
  <style>
    @import url("https://fonts.googleapis.com/css?family=Tilt+Neon");

    :root {
      --font-style-tilt-neon: "Tilt Neon";
    }

    html {
      scroll-behavior: smooth;
      user-select: none;
    }

    ::-webkit-scrollbar {
      width: 0;
      background-color: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background-color: transparent;
    }

    body {
      margin: 0;
      background-color: #181a20;
      display: block;
      font-family: var(--font-style-tilt-neon);
      opacity: 1;
    }

    #pw-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
    }

    #name-container {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ds,
    .sc {
      font-size: 50px;
      font-family: var(--font-style-tilt-neon);
      text-decoration: none;
      color: #d9d9d9;
    }

    .ds:hover,
    .sc:hover {
      color: #fcd535;
    }

    #card-container {
      display: flex;
      padding: 10px;
      overflow-x: auto;
    }

    .card {
      height: 40vh;
      width: 15vw;
      border-radius: 8px;
      margin: 0px 5px;
      padding: 5px;
      background-color: #d9d9d9;
      border: #d9d9d9 1px solid;
      color: #d9d9d9;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 20px;
      position: relative;
      cursor: pointer;
      flex: 0 0 auto;
      scroll-snap-align: start;
    }

    .text {
      font-size: 28px;
      color: #181a20;
    }

    .download {
      display: none;
      position: absolute;
      background-color: #fcd535;
      border: #d9d9d9 1px solid;
      color: #181a20;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 20px;
    }

    .card:hover .text {
      display: none;
    }

    .card:hover .download {
      display: block;
      border: #181a20 1px solid;
    }

    p {
      display: none;
    }
  </style>

  <body>
    <div id="pw-overlay"></div>
    <div id="protected-content">
      <div id="practicals-section">
        <div id="name-container">
          <span class="ds">Practicals</span>
        </div>
        <div id="card-container">
          <div class="card">
            <span class="text">Blockchain</span>
            <button
              class="download"
              onclick="
                window.open(
                  'https://drive.google.com/uc?export=download&id=1Z3jWFLr6UI32tI54_utYfpB18tnbIbVG',
                  '_blank',
                )
              "
            >
              Download
            </button>
          </div>
          <div class="card">
            <span class="text">Deep Learning</span>
            <button
              class="download"
              onclick="
                window.open(
                  'https://drive.google.com/uc?export=download&id=1wkRt0Ndgy4S-NqX-xrUOUL0o6h3WsrIv',
                  '_blank',
                )
              "
            >
              Download
            </button>
          </div>
          <div class="card">
            <span class="text">Robotics</span>
            <button
              class="download"
              onclick="
                window.open(
                  'https://drive.google.com/uc?export=download&id=1mUsJ0V25Xt8n3CJJh4IbY-C6FQVZGs4M',
                  '_blank',
                )
              "
            >
              Download
            </button>
          </div>
        </div>
      </div>
      <div id="datasets-section">
        <div id="name-container">
          <span class="sc">Datasets</span>
        </div>
        <div id="card-container">
          <div class="card">
            <span class="text">Double_UI</span>
            <button
              class="download"
              onclick="
                window.open(
                  'https://drive.google.com/uc?export=download&id=1mwWIYDXMGkBpuBgltqdpWBnsJuCE9F5a',
                  '_blank',
                )
              "
            >
              Download
            </button>
          </div>
          <div class="card">
            <span class="text">EMP</span>
            <button
              class="download"
              onclick="
                window.open(
                  'https://drive.google.com/uc?export=download&id=1cGTyNZGLZYT8jDUJ1_lNQuQLFMHJZ_g-',
                  '_blank',
                )
              "
            >
              Download
            </button>
          </div>
          <div class="card">
            <span class="text">new_emp</span>
            <button
              class="download"
              onclick="
                window.open(
                  'https://drive.google.com/uc?export=download&id=1iDRRMQUrojn3uo1ithawVSDaY04XMPa_',
                  '_blank',
                )
              "
            >
              Download
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script>
    window.onload = function () {
      const correctPassword = "msc2026";
      const datasetsOnlyPassword = "msc";
      const content = document.getElementById("protected-content");
      const overlay = document.getElementById("pw-overlay");
      const practicalsSection = document.getElementById("practicals-section");
      const datasetsSection = document.getElementById("datasets-section");
      let attempts = 0,
        maxAttempts = 3;
      function showAll() {
        content.style.display = "block";
        overlay.style.display = "none";
        practicalsSection.style.display = "block";
        datasetsSection.style.display = "block";
      }
      function showDatasetsOnly() {
        content.style.display = "block";
        overlay.style.display = "none";
        practicalsSection.style.display = "none";
        datasetsSection.style.display = "block";
      }
      function askPassword() {
        const input = prompt("Enter the password to view the content:");
        if (input === null) {
          attempts++;
          if (attempts >= maxAttempts) {
            alert("Maximum attempts exceeded.");
            document.body.innerHTML =
              "<h1 style='color:white;text-align:center;'>Access Denied</h1>";
          } else {
            alert("No input provided. Try again.");
            askPassword();
          }
          return;
        }

        if (input === correctPassword) {
          showAll();
        } else if (input === datasetsOnlyPassword) {
          showDatasetsOnly();
        } else {
          attempts++;
          if (attempts >= maxAttempts) {
            alert("Maximum attempts exceeded.");
            document.body.innerHTML =
              "<h1 style='color:white;text-align:center;'>Access Denied</h1>";
          } else {
            alert("Incorrect password. Try again.");
            askPassword();
          }
        }
      }
      content.style.display = "none";
      practicalsSection.style.display = "block";
      datasetsSection.style.display = "block";
      askPassword();
    };
  </script>
</html>
