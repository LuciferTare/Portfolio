<!DOCTYPE html>
<html>

<head>
    <title>MSC IT</title>
</head>
<style>
    @import url('https://fonts.googleapis.com/css?family=Tilt+Neon');

    :root {
        --font-style-tilt-neon: 'Tilt Neon';
    }

    html {
        scroll-behavior: smooth;
        user-select: none;
    }

    ::-webkit-scrollbar {
        width: 0;
        background-color: transparent;
    }

    ::-webkit-scrollbar-thumb {
        background-color: transparent;
    }

    body {
        margin: 0;
        background-color: #181A20;
        display: block;
        font-family: var(--font-style-tilt-neon);
        opacity: 1;
    }

    #pw-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 9999;
    }

    #name-container {
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .ds,
    .sc {
        font-size: 50px;
        font-family: var(--font-style-tilt-neon);
        text-decoration: none;
        color: #D9D9D9;
    }

    .ds:hover,
    .sc:hover {
        color: #FCD535;
    }

    #card-container {
        display: flex;
        padding: 10px;
        overflow-x: auto;
    }

    .card {
        height: 40vh;
        width: 15vw;
        border-radius: 8px;
        margin: 0px 5px;
        padding: 5px;
        background-color: #D9D9D9;
        border: #D9D9D9 1px solid;
        color: #D9D9D9;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 20px;
        position: relative;
        cursor: pointer;
        flex: 0 0 auto;
        scroll-snap-align: start;
    }

    .text {
        font-size: 28px;
        color: #181A20;
    }

    .download {
        display: none;
        position: absolute;
        background-color: #FCD535;
        border: #D9D9D9 1px solid;
        color: #181A20;
        padding: 5px 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 20px;
    }

    .card:hover .text {
        display: none;
    }

    .card:hover .download {
        display: block;
        border: #181A20 1px solid;
    }

    p {
        display: none;
    }
</style>

<body>
    <div id="pw-overlay">
    </div>
    <div id="protected-content">
        <div id="name-container">
            <span class="ds">Practicals</span>
        </div>
        <div id="card-container">
            <div class="card">
                <span class="text">Machine Learning</span>
                <button class="download"
                    onclick="window.open('https://drive.google.com/uc?export=download&id=1aycoQ4h-Uv5xE9Ow0-9bUUG3Xz9Ueq9Z', '_blank')">Download</button>
            </div>
            <div class="card">
                <span class="text">Advanced Artificial Learning</span>
                <button class="download"
                    onclick="window.open('https://drive.google.com/uc?export=download&id=1-1Wj58bqzFshqmXbUsj8nFqBOMYX9HlVcV', '_blank')">Download</button>
            </div>
        </div>
        <div id="name-container">
            <span class="sc">Datasets</span>
        </div>
        <div id="card-container">
            <div class="card">
                <span class="text">iris.csv</span>
                <button class="download"
                    onclick="window.open('https://drive.google.com/uc?export=download&id=1UluAsnH6JHnWEOixEF9gpt5fulkJl-w6', '_blank')">Download</button>
            </div>
            <div class="card">
                <span class="text">weather_forecast.csv</span>
                <button class="download"
                    onclick="window.open('https://drive.google.com/uc?export=download&id=1O5QdhzcGDX3GsXi_xbIbD7ZDlT-sh_1d', '_blank')">Download</button>
            </div>
            <div class="card">
                <span class="text">download.jpg</span>
                <button class="download"
                    onclick="window.open('https://drive.google.com/uc?export=download&id=1_bkqL74gzWCfm3SAwOI-fuGvESRw5WIn', '_blank')">Download</button>
            </div>
            <div class="card">
                <span class="text">iot.jpg</span>
                <button class="download"
                    onclick="window.open('https://drive.google.com/uc?export=download&id=1Vaf9Xs-yC_0w2e09lwpaK2xyAs3ww3qX', '_blank')">Download</button>
            </div>
            <div class="card">
                <span class="text">coco.names</span>
                <button class="download"
                    onclick="window.open('https://drive.google.com/uc?export=download&id=1ZnLbJQYroxytBXqGpWV1TCV6jJqz-upT', '_blank')">Download</button>
            </div>
            <div class="card">
                <span class="text">yolov3.cfg</span>
                <button class="download"
                    onclick="window.open('https://drive.google.com/uc?export=download&id=1Z7wmoFNF9RK8C7LszOKxUYlY8kqdTCVN', '_blank')">Download</button>
            </div>
            <div class="card">
                <span class="text">yolov3.weights</span>
                <button class="download"
                    onclick="window.open('https://drive.google.com/uc?export=download&id=1svzwhpAjo51sYsf-AtomLdUAgCkfMgm3', '_blank')">Download</button>
            </div>
            <div class="card">
                <span class="text">dataset.zip</span>
                <button class="download"
                    onclick="window.open('https://drive.google.com/uc?export=download&id=1nGod8YkibaGXC7FBIqn0voiaSrNUsMd1', '_blank')">Download</button>
            </div>
        </div>
    </div>
</body>
<script>
    window.onload = function () {
        const correctPassword = "msc2026";
        const content = document.getElementById("protected-content");
        const overlay = document.getElementById("pw-overlay");
        let attempts = 0, maxAttempts = 3;

        function askPassword() {
            const input = prompt("Enter the password to view the content:");
            if (input === correctPassword) {
                content.style.display = "block";
                overlay.style.display = "none";
            } else {
                attempts++;
                if (attempts >= maxAttempts) {
                    alert("Maximum attempts exceeded.");
                    document.body.innerHTML =
                        "<h1 style='color:white;text-align:center;'>Access Denied</h1>";
                } else {
                    alert("Incorrect password. Try again.");
                    askPassword();
                }
            }
        }

        content.style.display = "none";
        askPassword();
    };  
</script>

</html>
